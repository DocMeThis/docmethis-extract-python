[project]
name = "docmethis-extract-python"
version = "0.1.0"
description = "Static Python project extraction for DocMeThis."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-DocMeThis-Source-Access"
license-files = ["LICENSE"]
dependencies = [
    "typeshed-client>=2.8.2",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "portion",
    "ruff>=0.14.14",
]

[tool.uv.sources]
portion = { path = "tests/mock/portion" }

[tool.uv]
required-version = ">=0.12.5"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["docmethis_extract_python*"]

[tool.setuptools.package-data]
docmethis_extract_python = ["config/*.toml"]

[tool.ruff]
line-length = 130
target-version = "py312"
exclude = [".venv", ".pytest_cache", ".ruff_cache", "build", "dist", "tests/mock/**"]

[tool.ruff.format]
exclude = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
norecursedirs = ["tests/mock/**"]
markers = []

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D401", "COM812"]
# D401: multilingual prose; COM812: handled by ruff format.

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "S603", "S607", "PLR2004", "PLR0913", "PLR0917", "ANN201", "FBT001", "SLF001", "D102", "D103", "ANN003"]
"scripts/*" = ["T201"]

[tool.contract-guard]
# Keep this list aligned with the public and persisted extract-python contracts.
# Patterns are exact paths or directory prefixes, not globs.
patterns = [
    "pyproject.toml",
    "src/docmethis_extract_python/__init__.py",
    "src/docmethis_extract_python/__main__.py",
    "src/docmethis_extract_python/api.py",
    "src/docmethis_extract_python/time.py",
    "src/docmethis_extract_python/static_extraction/__init__.py",
    "src/docmethis_extract_python/static_extraction/models.py",
    "src/docmethis_extract_python/static_extraction/normal_return.py",
    "src/docmethis_extract_python/static_extraction/cache.py",
    "src/docmethis_extract_python/static_extraction/configuration.py",
    "src/docmethis_extract_python/config/exclusions.toml",
    "tests/test_public_contract.py",
    "tests/static_extraction/test_models.py",
    "tests/static_extraction/test_normal_return.py",
    "tests/static_extraction/test_cache.py",
    "tests/static_extraction/test_configuration.py",
    "tests/static_extraction/test_c7_positions.py",
]

[tool.docmethis.check]
check-mode = "regression"
fail-on-warning = true
include-visibility = ["public", "protected", "private"]
symbol-kinds = ["function", "method", "class", "module"]
dia = true
# Temporary workaround for DIA's classification of test assertions as API contracts.
dia-exclude-paths = ["tests/"]
profile = "strict"

[tool.docmethis.fix]
allow-full-rewrite-fallback = false
allowed-dia-statuses = ["confirmed"]
api-config-file = ".github/docmethis-fix/llm_api.toml"
docstring-language = "en"
docstring-quote-style = "double"
include-existing-docstrings = true
max-concurrency = 5
model = "deepseek-v4.1-flash"
policy-config-file = ".github/docmethis-fix/llm_policies.toml"
profile = "opencode"
scope = "impacted"
