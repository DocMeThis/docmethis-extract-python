name: Extract CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and package gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install development environment
        run: uv sync --dev --locked

      - name: Actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
        with:
          files: .github/workflows/**/*.yml

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest -q

      - name: Build wheel and sdist
        run: uv build

      - name: Verify clean installation of both artifacts
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            name="$(basename "${artifact}")"
            venv="${RUNNER_TEMP}/${name}.venv"
            python -m venv "${venv}"
            interpreter="${venv}/bin/python"
            uv pip install --python "${interpreter}" "${artifact}"
            uv pip install --python "${interpreter}" pytest pytest-cov
            "${interpreter}" -c 'import docmethis_extract_python'
            "${interpreter}" -c 'from importlib.resources import files; assert files("docmethis_extract_python").joinpath("config", "exclusions.toml").is_file()'
            artifact_id="${name%.whl}"
            artifact_id="${artifact_id%.tar.gz}"
            fixture="${RUNNER_TEMP}/portion-${artifact_id}"
            cp -a tests/mock/portion "${fixture}"
            uv pip install --python "${interpreter}" -e "${fixture}"
            "${interpreter}" -m docmethis_extract_python "${fixture}" --full-reanalysis -v
          done

      - name: Write owner artifact manifest
        run: uv run python scripts/write_owner_artifact_manifest.py --repository https://github.com/DocMeThis/docmethis-extract-python

      - name: Upload owner artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docmethis-extract-python-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
