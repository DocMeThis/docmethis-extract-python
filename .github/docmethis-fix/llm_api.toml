# ============================================================
# Configuration des backends de génération
# En MVP, les providers réels utilisent implicitement l'engine vLLM.
# ============================================================

# Connexion à une instance vLLM locale (sans authentification)
[default]
provider = "openai_compatible"
base_url = "http://localhost:8000/v1"
request_timeout_cap_seconds = 60.0
connect_timeout_seconds = 5.0
read_timeout_seconds = 60.0
pool_timeout_seconds = 10.0
http_max_connections = 100
http_max_keepalive_connections = 20
http_keepalive_expiry_seconds = 30.0

# Backend OpenRouter
[openrouter]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env_var = "OPENROUTER_API_KEY"
request_timeout_cap_seconds = 30.0
connect_timeout_seconds = 10.0
read_timeout_seconds = 30.0
pool_timeout_seconds = 10.0
http_max_connections = 10
http_max_keepalive_connections = 5
http_keepalive_expiry_seconds = 30.0

